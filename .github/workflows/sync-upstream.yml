name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点
  workflow_dispatch: {}     # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}   # PAT（fork 的 GITHUB_TOKEN 只读，push 需 PAT）
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/venera-app/venera-configs.git
          git fetch upstream main
          # 无新提交则跳过
          if [ "$(git rev-list --count HEAD..upstream/main)" -eq 0 ]; then
            echo "Already up to date, nothing to sync."
            exit 0
          fi
          git merge upstream/main --no-edit
          git push origin main
